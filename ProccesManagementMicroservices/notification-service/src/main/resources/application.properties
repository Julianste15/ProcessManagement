server.port=8084
spring.application.name=notification-service

# El envío real de correo no está implementado: EmailServiceSimulado solo escribe en logs.
# Si en el futuro se conecta un SMTP, las credenciales deben llegar por variables de entorno
# (p. ej. SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD), nunca desde el repositorio.
notification.email.enabled=true
notification.email.from=${NOTIFICATION_EMAIL_FROM:notificaciones@unicauca.edu.co}

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

spring.datasource.url=jdbc:postgresql://localhost:5432/notificationdb
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.co.unicauca.notification=DEBUG
logging.level.org.springframework.amqp=INFO