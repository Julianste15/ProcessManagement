server:
  port: 8083

spring:
  application:
    name: format-a-service
  datasource:
    url: jdbc:postgresql://localhost:5432/formatoadb
    driverClassName: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

user:
  service:
    url: http://user-service/api/users
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: basic

logging:
  level:
    co.unicauca.formata: DEBUG
    org.springframework.cloud.openfeign: DEBUG

event:
  exchange: formato_events_exchange
  routing-key: formato.a.enviado

format-a:
  storage:
    path: ./storage/formata
    # Límite único de tamaño del PDF (10 MB). Debe coincidir con el multipart.
    max-size-bytes: 10485760