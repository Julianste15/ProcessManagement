server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            # El cliente de escritorio (JavaFX) no usa CORS. Solo se permite
            # explícitamente lo que se configure aquí (nunca "*" con credenciales).
            allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080}
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600
            
      routes:

        - id: auth-service-public
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/login
          filters:
            - LoggingFilter
            
        - id: user-service-public
          uri: lb://USER-SERVICE 
          predicates:
            - Path=/api/users/register
          filters:
            - LoggingFilter

        - id: auth-service-protected
          uri: lb://AUTH-SERVICE  
          predicates:
            - Path=/api/auth/**
          filters:
            - AuthenticationFilter
            - LoggingFilter
            
        - id: user-service-protected
          uri: lb://USER-SERVICE  
          predicates:
            - Path=/api/users/**,/api/department-head/**
          filters:
            - AuthenticationFilter
            - LoggingFilter
            
        - id: evaluation-service
          uri: lb://EVALUATION-SERVICE 
          predicates:
            - Path=/api/evaluations/**,/api/evaluation-assignments/**
          filters:
            - name: AuthenticationFilter
              args:
                allowedRoles: TEACHER,COORDINATOR
            - LoggingFilter
            
        - id: format-a-service
          uri: lb://FORMAT-A-SERVICE 
          predicates:
            - Path=/api/format-a/**
          filters:
            - name: AuthenticationFilter
              args:
                allowedRoles: STUDENT,TEACHER,COORDINATOR
            - LoggingFilter
            
        - id: anteproject-service
          uri: lb://ANTEPROJECT-SERVICE 
          predicates:
            - Path=/api/anteprojects/**
          filters:
            - name: AuthenticationFilter
              args:
                allowedRoles: STUDENT,TEACHER,COORDINATOR
            - LoggingFilter

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    co.unicauca.gateway: DEBUG

